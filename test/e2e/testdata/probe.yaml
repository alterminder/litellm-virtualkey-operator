apiVersion: v1
kind: Pod
metadata:
  name: rotation-probe
  namespace: litellm
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6 # 8.12.1
      envFrom:
        - secretRef:
            name: probe-credentials
      command: [sh, -c]
      args:
        - |
          round=0
          while [ ! -f /tmp/stop ]; do
            round=$((round + 1))
            v1=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              -H "Authorization: Bearer $V1" http://litellm:4000/v1/models) || v1=000
            v2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              -H "Authorization: Bearer $V2" http://litellm:4000/v1/models) || v2=000
            printf 'round=%s v1=%s v2=%s\n' "$round" "$v1" "$v2"
            sleep 0.2
          done
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
