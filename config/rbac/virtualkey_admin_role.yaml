# This rule is not used by the project litellm-virtualkey-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over litellm.alter.lab.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: litellm-virtualkey-operator
    app.kubernetes.io/managed-by: kustomize
  name: virtualkey-admin-role
rules:
- apiGroups:
  - litellm.alter.lab
  resources:
  - virtualkeys
  verbs:
  - '*'
- apiGroups:
  - litellm.alter.lab
  resources:
  - virtualkeys/status
  verbs:
  - get
